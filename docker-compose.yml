version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: erp_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-erp_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp_password}
      POSTGRES_DB: ${DB_NAME:-erp_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp_admin} -d ${DB_NAME:-erp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erp-network
    restart: unless-stopped

  redis:
    image: redis:8.0-M03-alpine
    container_name: erp_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erp-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: erp_keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-erp_db}
      KC_DB_USERNAME: ${DB_USER:-erp_admin}
      KC_DB_PASSWORD: ${DB_PASSWORD:-erp_password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    command: ["start-dev"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: erp_api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-erp_admin}:${DB_PASSWORD:-erp_password}@postgres:5432/${DB_NAME:-erp_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      PORT: 3000
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp-network
    restart: unless-stopped
    develop:
      watch:
        - path: apps/api/src
          action: rebuild

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: erp_web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - erp-network
    restart: unless-stopped
    develop:
      watch:
        - path: apps/web/src
          action: rebuild

volumes:
  pgdata:
  redisdata:

networks:
  erp-network:
    driver: bridge
